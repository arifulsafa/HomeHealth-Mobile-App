name: healthdoc_mobile
description: HealthDoc - Home Health Documentation Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  go_router: ^13.0.0

  # Networking
  dio: ^5.4.0
  http: ^1.1.2
  connectivity_plus: ^5.0.2

  # Local Storage & Database
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Audio Recording
  flutter_sound: ^9.2.13
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  permission_handler: ^11.1.0

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Background Tasks
  workmanager: ^0.5.2
  flutter_background_service: ^5.0.5

  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.1
  logger: ^2.0.2+1
  equatable: ^2.0.5
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  drift_dev: ^2.14.1
  json_serializable: ^6.7.1


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
  
  # Uncomment when font files are added
  # fonts:
  #   - family: Inter
